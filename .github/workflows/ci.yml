name: KeyFlip

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish an unsigned preview pre-release from this run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs (tag in the comment); Dependabot keeps them current.
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - id: version
        name: Check version is identical everywhere
        run: node scripts/check-version.mjs --github
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (real Chromium with the extension loaded)
        run: npm run e2e
      - name: Accessibility scan (axe-core, WCAG 2.1 A/AA)
        run: npm run a11y
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyflip-chrome-extension
          path: extension/dist
          if-no-files-found: error

  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test core
        run: dotnet test desktop/KeyFlip.Core.Tests -c Release
      - name: Vulnerable NuGet packages
        shell: pwsh
        run: |
          $out = dotnet list desktop/KeyFlip.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $out
          if ($out -match 'has the following vulnerable packages') { exit 1 }
      - name: Publish (framework-dependent, needs .NET 10 Desktop Runtime)
        run: dotnet publish desktop/KeyFlip.App -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/framework-dependent
      - name: Publish (self-contained)
        run: dotnet publish desktop/KeyFlip.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/self-contained
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyflip-windows-framework-dependent
          path: out/framework-dependent/KeyFlip.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyflip-windows-self-contained
          path: out/self-contained/KeyFlip.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: [extension, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.extension.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            LICENSE
            NOTICE.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir release
          (cd artifacts/keyflip-chrome-extension && zip -r "../../release/KeyFlip-${VERSION}-chrome-extension.zip" .)
          cp artifacts/keyflip-windows-self-contained/KeyFlip.exe "release/KeyFlip-${VERSION}-windows-x64-self-contained.exe"
          cp artifacts/keyflip-windows-framework-dependent/KeyFlip.exe "release/KeyFlip-${VERSION}-windows-x64-needs-dotnet10.exe"
          cp LICENSE NOTICE.md release/
          (cd release && sha256sum * > SHA256SUMS.txt)
      - name: Publish unsigned preview pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}-preview.${GITHUB_RUN_NUMBER}" release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "KeyFlip ${VERSION} preview (build ${GITHUB_RUN_NUMBER})" \
            --notes "Unsigned PREVIEW build (pre-release), see the Code signing policy: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/CODE_SIGNING_POLICY.md

          Windows may show SmartScreen/antivirus warnings because the app uses a keyboard hook. Verify downloads with SHA256SUMS.txt.
          The Windows app needs Windows 10/11 x64; the 'needs-dotnet10' file requires the .NET 10 Desktop Runtime.
          License: Apache-2.0. Word lists: CC BY-SA 4.0 (see NOTICE.md)."
