name: Feature request / בקשת שיפור
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I understand KeyFlip will stay local-only (no network, no telemetry).
          required: true
